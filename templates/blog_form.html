{% extends "base.html" %}

{% block content %}
<div class="container my-4">
  <h1 class="mb-4">{% if form.instance.pk %}Редактирование{% else %}Создание{% endif %} поста</h1>

  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'blog_list' %}" class="btn btn-secondary ms-2">Отмена</a>
  </form>
</div>
{% endblock %}
