{% extends "base.html" %}

{% block content %}
<h1>{{ post.title }}</h1>

{% if post.preview_image %}
  <img src="{{ post.preview_image.url }}" alt="{{ post.title }}" style="max-width:400px;">
{% endif %}

<p>Дата: {{ post.created_at|date:"d.m.Y H:i" }}</p>
<p>Просмотров: {{ post.views_count }}</p>
<p>{{ post.content }}</p>

<a href="{% url 'blog_edit' post.pk %}">Редактировать</a> |
<a href="{% url 'blog_delete' post.pk %}">Удалить</a> |
<a href="{% url 'blog_list' %}">Назад к списку</a>
{% endblock %}
